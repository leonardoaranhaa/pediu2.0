<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: Fredoka;
      src: url("Fredoka.ttf") format("truetype");
      font-weight: 300 700;
      font-stretch: 75% 125%;
      font-display: block;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #FFF4E8; }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      background:
        radial-gradient(ellipse 70% 80% at 50% 48%, #FFFBF4 0%, #FFF4E8 55%, #F6E4CC 100%);
      overflow: hidden;
      font-family: Fredoka, "DejaVu Sans", sans-serif;
      color: #1A120C;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(48px);
      pointer-events: none;
    }
    .blob-a { width: 300px; height: 300px; left: -90px; top: 200px; background: #E20D2A; opacity: 0.10; }
    .blob-b { width: 240px; height: 240px; right: -40px; top: 20px; background: #FFC400; opacity: 0.16; }
    .blob-c { width: 220px; height: 220px; left: 470px; bottom: -80px; background: #E20D2A; opacity: 0.07; }

    .food {
      position: absolute;
      border-radius: 50%;
      overflow: hidden;
      box-shadow:
        0 22px 40px rgba(26, 18, 12, 0.20),
        0 0 0 7px #FFF4E8,
        0 0 0 10px rgba(226, 13, 42, 0.16);
      background: #FFF4E8;
    }
    .food img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .pizza  { width: 350px; height: 350px; left: -78px; top: 138px; }
    .pizza img { object-position: 52% 48%; transform: scale(1.08); }
    .burger { width: 368px; height: 368px; right: -86px; top: 78px; }
    .burger img { object-position: 50% 46%; transform: scale(1.12); }
    .acai   { width: 208px; height: 208px; left: 142px; bottom: -54px; }
    .acai img { object-position: 50% 48%; transform: scale(1.05); }

    .lockup {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 4;
      padding: 0 250px 8px;
      background: radial-gradient(ellipse 58% 64% at 50% 48%, #FFF4E8 0%, rgba(255,244,232,0.92) 40%, rgba(255,244,232,0) 72%);
    }
    .bolt {
      width: 36px;
      height: 52px;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 6px rgba(255, 196, 0, 0.4));
    }
    .wordmark {
      font-weight: 700;
      font-stretch: 110%;
      font-size: 176px;
      line-height: 0.88;
      letter-spacing: 0.012em;
      color: #E20D2A;
      text-shadow: 0 10px 0 rgba(226, 13, 42, 0.12);
      font-variation-settings: "wght" 700, "wdth" 110;
    }
    .tag {
      margin-top: 18px;
      font-weight: 600;
      font-stretch: 100%;
      font-size: 34px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #1A120C;
      opacity: 0.78;
      font-variation-settings: "wght" 600, "wdth" 100;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>

    <div class="food pizza">
      <img src="pizza.jpg" alt="" />
    </div>
    <div class="food burger">
      <img src="burger.jpg" alt="" />
    </div>
    <div class="food acai">
      <img src="acai.jpg" alt="" />
    </div>

    <div class="lockup">
      <svg class="bolt" viewBox="0 0 48 72" aria-hidden="true">
        <path fill="#FFC400" d="M29 0 6 40h16L12 72l30-44H27L29 0z"/>
      </svg>
      <div class="wordmark">PEDIÚ</div>
      <div class="tag">comida na porta</div>
    </div>
  </div>
</body>
</html>
